<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-muted: hsl(210 40% 96.1%);
  --text: hsl(222 47% 11%);
  --text-muted: hsl(215 16% 47%);
  --border: hsl(220 13% 91%);

  --danger: hsl(0 84% 60%);

  --bar-border: hsl(217 33% 18%);
  --bar-text: hsl(210 20% 96%);
  --bar-muted: hsl(217 18% 68%);
  --up-bg: #dcfce7;
  --up-fg: #15803d;
  --down-bg: #fee2e2;
  --down-fg: #b91c1c;
  --flat-bg: hsl(220 13% 91%);
  --flat-fg: hsl(220 9% 46%);
  --v-scale-bg: #dbeafe;
  --v-scale-fg: #1d4ed8;
  --v-scale-bd: #bfdbfe;
  --v-keep-bg: #ede9fe;
  --v-keep-fg: #6d28d9;
  --v-keep-bd: #ddd6fe;
  --v-iterate-bg: #fef3c7;
  --v-iterate-fg: #b45309;
  --v-iterate-bd: #fde68a;
  --v-check-bg: #e0f2fe;
  --v-check-fg: #0369a1;
  --v-check-bd: #bae6fd;
  --v-kill-bg: #fee2e2;
  --v-kill-fg: #b91c1c;
  --v-kill-bd: #fecaca;
  --v-early-bg: #f3f4f6;
  --v-early-fg: #4b5563;
  --v-early-bd: #e5e7eb;
  --v-cant-bg: #f3f4f6;
  --v-cant-fg: #4b5563;
  --v-cant-bd: #e5e7eb;
  --tone-scale-bd: #86efac;
  --tone-scale-bg: rgb(240 253 244 / .6);
  --tone-warn-bd: #fcd34d;
  --tone-warn-bg: rgb(255 251 235 / .6);
  --series-1: #6366f1;
  --series-2: #16a34a;
  --series-3: #f59e0b;
  --series-4: #f43f5e;
  --series-5: #06b6d4;
  --series-6: #d946ef;
  --series-neutral: #64748b;
  --series-other: #b4bcc8;
  --shadow: 0 1px 2px rgb(0 0 0 / .05);
  --hover-border: hsl(251 97% 60% / .4);
  --hover-shadow: 0 4px 12px hsl(251 97% 60% / .08);
  --radius: 10px;
  --radius-sm: 6px;
  --font-body: "DM Sans", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-head: var(--font-body);
  --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --success: #059669;
  --error: #dc2626;
  --warning: #e8ad00;
  --info: #343CED;
  --ink-500: #6b6889;
  --ink-900: #0a0227;
  --page: var(--bg);
  --surface-soft: var(--surface-muted);
  --heading: var(--text);
  --body: var(--text-muted);
  --divider: var(--border);
  --accent-text: var(--accent);
  --chip-bg: var(--accent-soft);
  --violet-accent: var(--accent);
  --violet-button: var(--accent);
  --focus: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
      --bg: hsl(222 35% 5%);
      --surface: hsl(222 28% 11%);
      --surface-raised: hsl(222 28% 14%);
      --surface-muted: hsl(222 25% 17%);
      --text: hsl(210 20% 96%);
      --text-muted: hsl(217 18% 68%);
      --border: hsl(222 18% 29%);
      --accent: hsl(251 91% 64%);
      --accent-soft: hsl(251 91% 64% / .16);
      --danger: hsl(0 72% 55%);
      --up-bg: hsl(160 84% 51% / .10);
      --up-fg: hsl(160 84% 51%);
      --down-bg: hsl(0 91% 71% / .10);
      --down-fg: hsl(0 91% 71%);
      --flat-bg: hsl(222 25% 17%);
      --flat-fg: hsl(217 18% 68%);
      --v-scale-bg: hsl(217 91% 60% / .12);
      --v-scale-fg: hsl(217 91% 70%);
      --v-scale-bd: hsl(217 91% 60% / .3);
      --v-keep-bg: hsl(258 90% 60% / .12);
      --v-keep-fg: hsl(258 90% 70%);
      --v-keep-bd: hsl(258 90% 60% / .3);
      --v-iterate-bg: hsl(38 92% 60% / .12);
      --v-iterate-fg: hsl(38 92% 70%);
      --v-iterate-bd: hsl(38 92% 60% / .3);
      --v-check-bg: hsl(199 89% 60% / .12);
      --v-check-fg: hsl(199 89% 70%);
      --v-check-bd: hsl(199 89% 60% / .3);
      --v-kill-bg: hsl(0 84% 60% / .12);
      --v-kill-fg: hsl(0 84% 70%);
      --v-kill-bd: hsl(0 84% 60% / .3);
      --v-early-bg: hsl(220 9% 46% / .12);
      --v-early-fg: hsl(220 9% 70%);
      --v-early-bd: hsl(220 9% 46% / .3);
      --v-cant-bg: hsl(220 9% 46% / .12);
      --v-cant-fg: hsl(220 9% 70%);
      --v-cant-bd: hsl(220 9% 46% / .3);
      --tone-scale-bd: hsl(160 84% 51% / .4);
      --tone-scale-bg: hsl(160 84% 51% / .06);
      --tone-warn-bd: hsl(38 92% 50% / .4);
      --tone-warn-bg: hsl(38 92% 50% / .06);
      --shadow: 0 1px 2px rgb(0 0 0 / .4);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: hsl(222 35% 5%);
  --surface: hsl(222 28% 11%);
  --surface-raised: hsl(222 28% 14%);
  --surface-muted: hsl(222 25% 17%);
  --text: hsl(210 20% 96%);
  --text-muted: hsl(217 18% 68%);
  --border: hsl(222 18% 29%);
  --accent: hsl(251 91% 64%);
  --accent-soft: hsl(251 91% 64% / .16);
  --danger: hsl(0 72% 55%);
  --up-bg: hsl(160 84% 51% / .10);
  --up-fg: hsl(160 84% 51%);
  --down-bg: hsl(0 91% 71% / .10);
  --down-fg: hsl(0 91% 71%);
  --flat-bg: hsl(222 25% 17%);
  --flat-fg: hsl(217 18% 68%);
  --v-scale-bg: hsl(217 91% 60% / .12);
  --v-scale-fg: hsl(217 91% 70%);
  --v-scale-bd: hsl(217 91% 60% / .3);
  --v-keep-bg: hsl(258 90% 60% / .12);
  --v-keep-fg: hsl(258 90% 70%);
  --v-keep-bd: hsl(258 90% 60% / .3);
  --v-iterate-bg: hsl(38 92% 60% / .12);
  --v-iterate-fg: hsl(38 92% 70%);
  --v-iterate-bd: hsl(38 92% 60% / .3);
  --v-check-bg: hsl(199 89% 60% / .12);
  --v-check-fg: hsl(199 89% 70%);
  --v-check-bd: hsl(199 89% 60% / .3);
  --v-kill-bg: hsl(0 84% 60% / .12);
  --v-kill-fg: hsl(0 84% 70%);
  --v-kill-bd: hsl(0 84% 60% / .3);
  --v-early-bg: hsl(220 9% 46% / .12);
  --v-early-fg: hsl(220 9% 70%);
  --v-early-bd: hsl(220 9% 46% / .3);
  --v-cant-bg: hsl(220 9% 46% / .12);
  --v-cant-fg: hsl(220 9% 70%);
  --v-cant-bd: hsl(220 9% 46% / .3);
  --tone-scale-bd: hsl(160 84% 51% / .4);
  --tone-scale-bg: hsl(160 84% 51% / .06);
  --tone-warn-bd: hsl(38 92% 50% / .4);
  --tone-warn-bg: hsl(38 92% 50% / .06);
  --shadow: 0 1px 2px rgb(0 0 0 / .4);
}
* { box-sizing: border-box; }
html { font-size: 15px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 1rem/1.5 var(--font-body);
  font-variant-numeric: tabular-nums;
}
.page { max-width: 1536px; margin: 0 auto; padding: 0 24px 56px; }
.eyebrow {
  font: 600 12px/1 var(--font-head);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 8px;
}
h1, h2, h3 { font-family: var(--font-head); color: var(--heading); letter-spacing: -0.01em; margin: 0; }
h2 { font-size: 20px; line-height: 1.2; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }
.grad { color: var(--accent); }
section.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin: 16px 0;
}
section.card > .eyebrow { margin-bottom: 8px; }
p { margin: 10px 0; }
.lead { font-size: 16px; color: var(--heading); }
.muted { font-size: 13px; }
.na { cursor: help; border-bottom: 1px dotted currentColor; }
.actions { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.actions li { border: 1px solid var(--divider); border-left: 4px solid var(--violet-accent); border-radius: 14px; padding: 14px 16px; background: var(--surface-soft); }
.actions strong { color: var(--heading); font-family: var(--font-head); }
.basis { background: var(--surface-muted); border: 1px dashed var(--border); border-radius: var(--radius); padding: 16px 18px; }
.basis pre { margin: 0; white-space: pre-wrap; font: 400 13px/1.55 var(--font-body); color: var(--body); }
.scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--divider); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); vertical-align: top; }
thead th { position: sticky; top: 0; z-index: 1; font: 600 11px/1.3 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: color-mix(in srgb, var(--text) 80%, transparent); background: var(--surface-muted); white-space: nowrap; }
tbody tr:hover td { background: var(--surface-muted); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll.tall { max-height: 70vh; overflow: auto; }
td.why { min-width: 260px; }
td.adname { white-space: nowrap; }
@media (max-width: 640px) { td.adname { white-space: normal; } }
tr.gap td:first-child { border-left: 4px solid var(--warning); }
tr.gap b { color: var(--heading); font-family: var(--font-head); }
td small { display: block; color: var(--body); opacity: 0.8; }
.badge { display: block; width: fit-content; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; font: 600 11px/1.4 var(--font-head); white-space: nowrap; color: var(--text); background: var(--chip-bg); }
.badge.scale { background: var(--v-scale-bg); color: var(--v-scale-fg); border-color: var(--v-scale-bd); }
.badge.keep { background: var(--v-keep-bg); color: var(--v-keep-fg); border-color: var(--v-keep-bd); }
.badge.iterate { background: var(--v-iterate-bg); color: var(--v-iterate-fg); border-color: var(--v-iterate-bd); }
.badge.check { background: var(--v-check-bg); color: var(--v-check-fg); border-color: var(--v-check-bd); }
.badge.kill { background: var(--v-kill-bg); color: var(--v-kill-fg); border-color: var(--v-kill-bd); }
.badge.early { background: var(--v-early-bg); color: var(--v-early-fg); border-color: var(--v-early-bd); }
.badge.cant { background: var(--v-cant-bg); color: var(--v-cant-fg); border-color: var(--v-cant-bd); }
.band { margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 600 11px/1.5 var(--font-head); background: var(--chip-bg); color: var(--accent-text); }
.band.low { background: var(--error); color: #ffffff; }
.band.top { background: var(--success); color: #ffffff; }
.reasons { margin: 0; padding-left: 16px; }
.reasons li { margin: 2px 0; }
.chart { margin: 14px 0; }
.chart svg { display: block; width: 100%; height: auto; max-height: 360px; margin: 0 auto; }
.chart figcaption { font-size: 13px; margin-top: 4px; }
figure.chart { margin: 14px 0; }
svg text { font-family: var(--font-body); fill: var(--body); font-size: 12px; }
svg .lbl { fill: var(--heading); }
svg .axis { stroke: var(--divider); stroke-width: 1; }
svg .guide { stroke: var(--ink-500); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
svg .bar { fill: var(--series-1); }
svg .bar.scale { fill: var(--success); }
svg .bar.keep { fill: var(--violet-accent); }
svg .bar.check { fill: var(--info); }
svg .bar.iterate { fill: var(--warning); }
svg .bar.kill { fill: var(--error); }
svg .bar.cant { fill: var(--ink-500); }
svg .bar.early { fill: var(--ink-500); }
svg .dot { fill: var(--series-1); fill-opacity: 0.75; stroke: var(--surface); stroke-width: 1.5; }
.cols { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cols.two { grid-template-columns: 1fr 1fr; } }
.grid-cell { text-align: center; min-width: 44px; }
.grid-cell.empty { background: var(--chip-bg); color: var(--accent-text); font-weight: 600; }
.grid-cell.full { color: var(--heading); font-weight: 600; }
.note-list { margin: 8px 0 0; padding-left: 18px; }
.note-list li { margin: 6px 0; }
code { font: 500 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip-bg); color: var(--accent-text); padding: 1px 6px; border-radius: 6px; }
footer { margin-top: 28px; font-size: 13px; text-align: center; }
footer b { color: var(--heading); font-family: var(--font-head); }
@media (max-width: 640px) {
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 10px 4px; border-bottom: 1px solid var(--divider); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { border: 0; padding: 4px 12px; text-align: left; }
  table.stack td.num::before { content: attr(data-label) ": "; color: var(--accent-text); font-weight: 600; }
  td.why { min-width: 0; }
}

.top { margin: 0; }
.topbar { display: flex; align-items: center; gap: 16px; height: 56px; }
.brand { flex: none; }
.brand svg { display: block; height: 28px; width: auto; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .logo-light { display: none; }
  :root:not([data-theme="light"]) .logo-dark { display: inline-block; }
}
:root[data-theme="dark"] .logo-light { display: none; }
:root[data-theme="dark"] .logo-dark { display: inline-block; }
.topbar h1 { flex: 1 1 auto; min-width: 0; margin: 0; font: 600 18px/1.2 var(--font-head); letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.status { display: inline-block; padding: 4px 12px; border-radius: 999px; font: 600 12px/1.3 var(--font-head); color: #ffffff; white-space: nowrap; }
.status.ok { background: var(--success); }
.status.bad { background: var(--error); }
.status.warn { background: var(--warning); color: var(--ink-900); }
.status.neutral { background: var(--flat-bg); color: var(--flat-fg); }
.theme-toggle { display: none; }
.js .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); cursor: pointer; }
.js .theme-toggle:hover { background: var(--surface-muted); color: var(--text); }
.theme-toggle .i-sun { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .i-sun { display: block; }
  :root:not([data-theme="light"]) .theme-toggle .i-moon { display: none; }
}
:root[data-theme="dark"] .theme-toggle .i-sun { display: block; }
:root[data-theme="dark"] .theme-toggle .i-moon { display: none; }
.scope-bar { display: flex; flex-wrap: wrap; background: var(--bar); color: var(--bar-text); border-radius: 12px; padding: 4px 0; margin: 0 0 16px; }
.scope-note { margin: -8px 0 16px; font-size: 12px; color: var(--text-muted); }
.scope-seg { display: flex; align-items: baseline; gap: 8px; padding: 8px 16px; border-right: 1px solid var(--bar-border); font-size: 14px; }
.scope-seg:last-child { border-right: 0; }
.scope-label { font-size: 13px; color: var(--bar-muted); }
.scope-seg b { font-weight: 600; }
.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 24px; align-items: start; }
.content { min-width: 0; }
nav.tabs { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 4px; }
nav.tabs a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-sm); color: var(--text-muted); text-decoration: none; font: 500 13px/1.3 var(--font-body); transition: background-color .2s ease; }
nav.tabs a:hover { background: var(--surface-muted); color: var(--text); }
nav.tabs a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
nav.tabs a[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
nav.tabs .ico { flex: none; }
section.tab { margin: 0 0 8px; scroll-margin-top: 72px; }
h3 { margin: 22px 0 8px; }
section.panel > h3:first-of-type { margin-top: 0; font-size: 20px; font-weight: 600; }
.banner { display: flex; gap: 8px; align-items: flex-start; margin: 0 0 16px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-muted); color: var(--text-muted); font-size: 13px; }
.banner .ico { flex: none; margin-top: 3px; }
.banner p { margin: 2px 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin: 8px 0; }
.kpi { display: flex; flex-direction: column; gap: 4px; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; transition: border-color .25s ease, box-shadow .25s ease; }
.kpi:hover { border-color: var(--hover-border); box-shadow: var(--hover-shadow); }
.kpi p { margin: 0; }
.kpi-name { font: 600 12px/1.3 var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
.kpi-value { font: 700 24px/1.2 var(--font-body); letter-spacing: -0.01em; color: var(--text); overflow-wrap: anywhere; }
.kpi.unknown .kpi-value { color: var(--text-muted); }
.kpi-note { margin: 0; font-size: 12px; color: var(--text-muted); }
.kpi.partial { border-color: var(--warning); }
.kpi-delta { font-size: 12px; color: var(--text-muted); }
.pill { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font: 600 12px/1.4 var(--font-body); }
.pill.up { background: var(--up-bg); color: var(--up-fg); }
.pill.down { background: var(--down-bg); color: var(--down-fg); }
.pill.flat { background: var(--flat-bg); color: var(--flat-fg); }
.kpi-spark { margin-top: auto; padding-top: 4px; min-height: 28px; font-size: 12px; }
svg.spark { display: block; width: 100%; height: 28px; }
svg.spark path { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
svg .line { fill: none; stroke: var(--series-2); stroke-width: 2.5; stroke-linejoin: round; }
svg .line.spend-line { stroke: var(--series-1); }
svg .line.value-line { stroke: var(--series-2); }
svg .guide.cut { stroke: var(--error); opacity: 1; stroke-dasharray: 5 4; }
svg .line-dot { fill: var(--series-2); }
ul.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; padding: 0; font-size: 12.5px; color: var(--heading); }
ul.legend li { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: none; background: var(--series-1); }
.sw.line { background: var(--series-2); height: 4px; border-radius: 2px; }
.sw.spend-line { background: var(--series-1); height: 4px; border-radius: 2px; box-shadow: 0 0 0 1px var(--surface); }
.sw.value-line { background: var(--series-2); height: 4px; border-radius: 2px; }
svg .track { fill: var(--chip-bg); }
.gauge svg { max-width: 300px; }
.ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 10px 0; }
.ad-grid.strip { grid-template-columns: repeat(auto-fill, minmax(160px, 200px)); justify-content: start; margin: 4px 0; }
.ad-card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; min-width: 0; transition: border-color .25s ease, box-shadow .25s ease; }
.ad-card:hover { border-color: var(--hover-border); box-shadow: var(--hover-shadow); }
.ad-card[data-tone="scale"] { border-color: var(--tone-scale-bd); background: var(--tone-scale-bg); }
.ad-card[data-tone="warn"] { border-color: var(--tone-warn-bd); background: var(--tone-warn-bg); }
.ad-card[data-tone="pause"] { border-left: 4px solid var(--danger); }
.ad-img { position: relative; aspect-ratio: 3 / 4; background: var(--surface-muted); overflow: hidden; container-type: inline-size; }

    [["Ad", ""], ["Spend", "num"], ["Verdict", ""]].forEach(function (c) { head.appendChild(el("th", c[1], c[0])); });
    var thead = el("thead");
    thead.appendChild(head);
    list.forEach(function (a) {
      var tr = el("tr"), name = el("td", "adname", a.label);
      tr.setAttribute("data-ad", a.id);
      name.appendChild(el("small", null, "Ad ID " + a.id));
      var spend = el("td", "num", money(present(a.spend) ? a.spend : null, 0));

      tr.appendChild(spend);

    table.appendChild(body);
    wrap.appendChild(table);
    d.appendChild(wrap);
    return d;
  }
  var TABLE_HEAD = [["Ad", ""], ["Format", ""], ["Verdict", ""], ["Spend", "num"], ["ROAS", "num"], ["CPA", "num"], ["CTR", "num"], ["Hook rate", "num"]];
  function cell(text, label, cls) {

  }
  function adsTable(list) {

    TABLE_HEAD.forEach(function (c) { head.appendChild(el("th", c[1], c[0])); });

  function thumb(a) {

  function previewGrid(list) {

        if (own(VERDICT_TIPS, a.verdict)) { chip.title = VERDICT_TIPS[a.verdict]; }

      grid.appendChild(fig);

  }
  function renderGallery(list) {
    live.textContent = "";

    groups.forEach(function (g) {
      var sec = el("section", "group"), head = el("header", "group-head"), grid = el("div", "ad-grid");
      var asGrid = el("div", "view-grid"), asTable = el("div", "view-table");

      sec.appendChild(head);
      sorted.slice(0, DATA.top_n).forEach(function (a) {
        var src = poolCard(a.id);
        if (src) { var c = src.cloneNode(true); enhanceCard(c); grid.appendChild(c); }
      });
      asGrid.appendChild(grid);
      if (sorted.length > DATA.top_n) { asGrid.appendChild(rowsDetails(sorted.slice(DATA.top_n))); }
      asTable.appendChild(adsTable(sorted));
      sec.appendChild(asGrid);
      sec.appendChild(asTable);
      live.appendChild(sec);
    });
  }

  function summaryText(vis) {
    var s = CR.summary(vis, DATA.ads.length, totalSpend());
    var text = "Showing " + vis.length + " of " + DATA.ads.length + " ads";
    if (!vis.length) { return text + "."; }
    text += " · " + (s.share === null ? "n/a" : Math.round(s.share) + "%") + " of spend · spend " + money(s.spend, 0) +
      ", purchases " + (s.conversions === null ? "n/a (missing purchases)" : fmt(s.conversions, 0)) +
      ", ROAS " + s.roas_text + ", CPA " + (s.cpa === null ? s.cpa_text : money(s.cpa, 2)) + noteSuffix(s) + ".";
    var extra = [];
    if (state.fat) { extra.push("tiring out"); }
    if (state.weak) { extra.push("weak step: " + state.weak); }
    if (state.top) { extra.push("top " + state.top + " by spend"); }
    return text + (extra.length ? " Also filtering on: " + extra.join("; ") + "." : "") + " Charts stay account-wide.";
  }
  function sync() {
    if (!DATA) { writeHash(); return; }
    var ads = DATA.ads, vis = CR.visible(ads, state), set = Object.create(null);
    vis.forEach(function (a) { set[a.id] = true; });
    $all("[data-facet]").forEach(function (chip) {
      var k = chip.getAttribute("data-facet"), v = chip.getAttribute("data-value");
      var on = (state.facets[k] || []).indexOf(v) >= 0, count = CR.facetCount(ads, state, k, v);
      chip.setAttribute("aria-pressed", on ? "true" : "false");
      chip.querySelector(".n").textContent = count;
      chip.classList.toggle("is-zero", count === 0);
    });
    $all("[data-preset]").forEach(function (chip) {
      var ps = CR.presetState(DATA.presets, chip.getAttribute("data-preset"), defs);
      var count = CR.visible(ads, ps).length;
      chip.setAttribute("aria-pressed", CR.sameFilters(state, ps) ? "true" : "false");
      chip.querySelector(".n").textContent = count;
      chip.classList.toggle("is-zero", count === 0);
    });
    var input = document.querySelector(".fb-input");
    if (input && input.value !== state.q) { input.value = state.q; }
    $all("select[data-action]").forEach(function (sel) { sel.value = state[sel.getAttribute("data-action")]; });
    $all("[data-action='previews-only']").forEach(function (b) { b.setAttribute("aria-pressed", state.pv ? "true" : "false"); });
    $all(".allads").forEach(function (n) { n.setAttribute("data-view", state.view); });
    $all("[data-view-pick]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-view-pick") === state.view ? "true" : "false"); });
    var line = document.querySelector(".fb-summary");
    if (line) { line.textContent = summaryText(vis); line.title = line.textContent; }
    var shown = CR.activeCount(state);
    $all(".fb-k").forEach(function (n) { n.textContent = shown ? " (" + shown + ")" : ""; });
    $all(".fb-clear").forEach(function (b) { b.classList.toggle("show", CR.active(state)); });
    $all(".fb-count").forEach(function (n) { n.textContent = vis.length + " of " + ads.length + " ads"; });
    var empty = document.querySelector(".fb-empty");
    if (empty) { empty.classList.toggle("show", vis.length === 0); }
    $all("[data-ad]").forEach(function (n) {
      if (live && live.contains(n)) { return; }
      n.classList.toggle("is-out", !set[n.getAttribute("data-ad")]);
    });
    if (stat && live) {
      var plain = !CR.active(state) && state.group === defs.group && state.sort === defs.sort && !state.pv;
      stat.classList.toggle("is-out", !plain);
      if (plain) { live.textContent = ""; } else { renderGallery(vis); }
    }
    writeHash();
  }
  function toggleIn(list, value) {
    var i = list.indexOf(value);
    if (i >= 0) { list.splice(i, 1); } else { list.push(value); }
    return list;
  }

  document.addEventListener("click", function (event) {
    var t = event.target, b;
    if (!t || !t.closest) { return; }
    if ((b = t.closest("[data-action='copy-prompt']"))) { copyPrompt(b); return; }
    if ((b = t.closest("[data-action='close-dialog']"))) { if (dialog) { dialog.close(); } return; }
    if (t.closest("[data-action='theme']")) {
      var next = shownTheme() === "dark" ? "light" : "dark";
      applyTheme(next);
      saveTheme(next);
      return;
    }
    $all("details.facets[open]").forEach(function (d) { if (!d.contains(t)) { d.open = false; } });
    if (!DATA) { return; }
    if (t.closest("[data-action='clear']")) { state = CR.emptyState(defs); sync(); return; }
    if (t.closest("[data-action='previews-only']")) { state.pv = !state.pv; sync(); return; }
    if ((b = t.closest("[data-view-pick]"))) { state.view = b.getAttribute("data-view-pick"); sync(); return; }
    if ((b = t.closest("[data-preset]"))) {
      var id = b.getAttribute("data-preset"), ps = CR.presetState(DATA.presets, id, defs);
      var def = DATA.presets.filter(function (p) { return p.id === id; })[0];
      if (CR.sameFilters(state, ps)) { ps = CR.emptyState(defs); def = null; }
      state.facets = ps.facets; state.fat = ps.fat; state.top = ps.top; state.weak = null;
      if (def && def.sort) { state.sort = def.sort; }
      sync();
      return;
    }
    if ((b = t.closest("[data-facet]"))) {
      var k = b.getAttribute("data-facet");
      state.facets[k] = toggleIn(state.facets[k] || [], b.getAttribute("data-value"));
      sync();
      return;
    }
    if ((b = t.closest("a[data-weak]"))) {
      event.preventDefault();
      state = CR.emptyState(defs);
      state.weak = b.getAttribute("data-weak");
      show("panel-all-ads");
      sync();
      return;
    }
    if (dialog && typeof dialog.showModal === "function" && (b = t.closest("details.open-ad > summary"))) {

      openCard(b.closest(".ad-card"), b);
      return;
    }
    if ((b = t.closest("[data-open]"))) {
      var card = poolCard(b.getAttribute("data-open"));

    if (img && img.closest(".ad-card")) { openCard(img.closest(".ad-card"), img); }
  });
  document.addEventListener("keydown", function (event) {
    var t = event.target;
    if (event.key === "Escape") {
      $all("details.facets[open]").forEach(function (d) { d.open = false; var s = d.querySelector("summary"); if (s) { s.focus(); } });
    }

  document.addEventListener("input", function (event) {

  });
  document.addEventListener("change", function (event) {
    var sel = event.target;

  });
  if (dialog) {
    dialog.addEventListener("close", function () { if (opener && opener.focus) { opener.focus(); } opener = null; });
    dialog.addEventListener("click", function (event) { if (event.target === dialog) { dialog.close(); } });

  links.forEach(function (link) {

  window.addEventListener("hashchange", function () { state = CR.fromHash(location.hash, defs); show(state.tab); sync(); });
  var closed = [];

  var tipBox = null;
  function box() {
    if (!tipBox) {

      tipBox.id = "tip";
      tipBox.setAttribute("role", "tooltip");
      tipBox.hidden = true;
      document.body.appendChild(tipBox);

  function tipFor(node) { return node && node.closest ? node.closest("[data-tip]") : null; }
  function showTip(target) {

    tipEl.textContent = target.getAttribute("data-tip");
    tipEl.hidden = false;
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight, y = at.top - h - 8;
    tipEl.style.left = Math.min(Math.max(8, at.left + at.width / 2 - w / 2), window.innerWidth - w - 8) + "px";
    tipEl.style.top = (y < 8 ? at.bottom + 8 : y) + "px";

  ["mouseover", "focusin"].forEach(function (name) {

  });
  document.addEventListener("keydown", function (event) { if (event.key === "Escape") { hideTip(); } });
  function pressed(btn) { return btn.getAttribute("aria-pressed") === "true"; }
  $all(".legend-chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      var scope = chip.closest("[data-scope]");
      if (!scope) { return; }
      var turningOff = pressed(chip);
      if (turningOff && $all(".legend-chip", scope).filter(pressed).length <= 1) { return; }
      chip.setAttribute("aria-pressed", turningOff ? "false" : "true");
      $all("g[data-series]", scope).forEach(function (g) {
        if (g.getAttribute("data-series") === chip.getAttribute("data-series")) { g.classList.toggle("is-off", turningOff); }
      });
    });
  });
  var switches = $all(".switch").map(function (sw) {
    var bar = sw.querySelector(".seg"), btns = $all("[data-pick]", bar), views = $all(".pick", sw), chosen = null;
    function pick(key) {
      chosen = key;
      btns.forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-pick") === key ? "true" : "false"); });
      views.forEach(function (v) { v.hidden = v.getAttribute("data-view") !== key; });
    }
    sw.classList.add("on");
    btns.forEach(function (b) { b.addEventListener("click", function () { pick(b.getAttribute("data-pick")); }); });
    pick((btns.filter(pressed)[0] || btns[0]).getAttribute("data-pick"));
    return { views: views, restore: function () { pick(chosen); } };
  });
  window.addEventListener("beforeprint", function () { switches.forEach(function (sw) { sw.views.forEach(function (v) { v.hidden = false; }); }); });
  window.addEventListener("afterprint", function () { switches.forEach(function (sw) { sw.restore(); }); });
  $all("article.ad-card").forEach(enhanceCard);

  });
  state = CR.fromHash(location.hash, defs);

  sync();
})();
