<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --violet-accent: #7c3aed;
  --violet-button: #6d28d9;
  --violet-50: #f5f3ff;
  --violet-100: #ede9fe;
  --violet-200: #ddd6fe;
  --violet-600: #7c3aed;
  --violet-900: #4c1d95;
  --ink-50: #f8f8fb;
  --ink-200: #e2e1ea;
  --ink-500: #6b6889;
  --ink-900: #0a0227;
  --success: #059669;
  --error: #dc2626;
  --warning: #e8ad00;
  --info: #343CED;

  --page: var(--ink-50);
  --glow: rgba(124, 58, 237, 0.16);
  --grad-from: var(--info);
  --surface: #ffffff;
  --surface-soft: var(--violet-50);
  --heading: var(--ink-900);
  --body: var(--ink-500);
  --divider: var(--ink-200);
  --accent-text: var(--violet-900);
  --chip-bg: var(--violet-100);
  --shadow: 0 1px 2px rgba(10, 2, 39, 0.05), 0 8px 24px rgba(76, 29, 149, 0.07);
  --font-head: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: var(--ink-900);
    --glow: rgba(124, 58, 237, 0.28);
    --grad-from: #8b92ff;
    --surface: #1a103d;
    --surface-soft: #1a103d;
    --heading: var(--ink-50);
    --body: var(--ink-200);
    --divider: rgba(221, 214, 254, 0.18);
    --accent-text: var(--violet-200);
    --chip-bg: rgba(124, 58, 237, 0.28);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--page);
  background-image: radial-gradient(60rem 28rem at 78% -6rem, var(--glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--body);
  font: 400 15px/1.6 var(--font-body);
}
.page { max-width: 1040px; margin: 0 auto; padding: 40px 16px 56px; }
.eyebrow {
  font: 600 12px/1 var(--font-head);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--violet-accent);
  margin: 0 0 12px;
}
h1, h2, h3 { font-family: var(--font-head); color: var(--heading); letter-spacing: -0.02em; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.08; font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: clamp(22px, 3.6vw, 28px); line-height: 1.15; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; margin: 24px 0 10px; }
.grad {
  background: linear-gradient(90deg, var(--grad-from), var(--violet-accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--violet-accent);
}
section.card {
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 28px 24px;
  margin: 20px 0;
}
section.card > .eyebrow { margin-bottom: 10px; }
p { margin: 10px 0; }
.lead { font-size: 16px; color: var(--heading); }
.muted { font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 6px; }
.stat { border: 1px solid var(--divider); border-radius: 14px; padding: 14px 16px; background: var(--surface-soft); }
.stat b { display: block; font: 800 28px/1.1 var(--font-head); letter-spacing: -0.03em; color: var(--heading); }
.stat span { font-size: 13px; }
.actions { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.actions li { border: 1px solid var(--divider); border-left: 4px solid var(--violet-accent); border-radius: 14px; padding: 14px 16px; background: var(--surface-soft); }
.actions strong { color: var(--heading); font-family: var(--font-head); }
.basis { background: var(--surface-soft); border: 1px dashed var(--divider); border-radius: 14px; padding: 16px 18px; }
.basis pre { margin: 0; white-space: pre-wrap; font: 400 13px/1.55 var(--font-body); color: var(--body); }
.scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--divider); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: top; }
th { font: 600 12px/1.3 var(--font-head); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-text); background: var(--surface-soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.why { min-width: 260px; }
td.adname { white-space: nowrap; }
@media (max-width: 640px) { td.adname { white-space: normal; } }
td small { display: block; color: var(--body); opacity: 0.8; }
.badge { display: block; width: fit-content; padding: 3px 10px; border-radius: 999px; font: 600 12px/1.4 var(--font-head); white-space: nowrap; color: var(--ink-900); background: var(--chip-bg); }
.badge.scale { background: var(--success); color: #ffffff; }
.badge.keep { background: var(--violet-accent); color: #ffffff; }
.badge.check { background: var(--info); color: #ffffff; }
.badge.iterate { background: var(--warning); color: var(--ink-900); }
.badge.kill { background: var(--error); color: #ffffff; }
.badge.cant { background: var(--ink-500); color: #ffffff; }
.badge.early { background: var(--ink-500); color: #ffffff; }
.band { margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 600 11px/1.5 var(--font-head); background: var(--chip-bg); color: var(--accent-text); }
.band.low { background: var(--error); color: #ffffff; }
.band.top { background: var(--success); color: #ffffff; }
.reasons { margin: 0; padding-left: 16px; }
.reasons li { margin: 2px 0; }
.chart { margin: 14px 0; }
.chart svg { display: block; width: 100%; height: auto; max-width: 600px; }
.chart figcaption { font-size: 13px; margin-top: 4px; }
figure.chart { margin: 14px 0; }
svg text { font-family: var(--font-body); fill: var(--body); font-size: 12px; }
svg .lbl { fill: var(--heading); }
svg .axis { stroke: var(--divider); stroke-width: 1; }
svg .guide { stroke: var(--ink-500); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
svg .bar { fill: var(--violet-accent); }
svg .bar.scale { fill: var(--success); }
svg .bar.keep { fill: var(--violet-accent); }
svg .bar.check { fill: var(--info); }
svg .bar.iterate { fill: var(--warning); }
svg .bar.kill { fill: var(--error); }
svg .bar.cant { fill: var(--ink-500); }
svg .bar.early { fill: var(--ink-500); }
svg .dot { fill: var(--violet-accent); fill-opacity: 0.75; stroke: var(--surface); stroke-width: 1.5; }
.cols { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cols.two { grid-template-columns: 1fr 1fr; } }
.grid-cell { text-align: center; min-width: 44px; }
.grid-cell.empty { background: var(--chip-bg); color: var(--accent-text); font-weight: 600; }
.grid-cell.full { color: var(--heading); font-weight: 600; }
.note-list { margin: 8px 0 0; padding-left: 18px; }
.note-list li { margin: 6px 0; }
code { font: 500 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip-bg); color: var(--accent-text); padding: 1px 6px; border-radius: 6px; }
footer { margin-top: 28px; font-size: 13px; text-align: center; }
footer b { color: var(--heading); font-family: var(--font-head); }
@media (max-width: 640px) {
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 10px 4px; border-bottom: 1px solid var(--divider); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { border: 0; padding: 4px 12px; text-align: left; }
  table.stack td.num::before { content: attr(data-label) ": "; color: var(--accent-text); font-weight: 600; }
  td.why { min-width: 0; }
}
@media (max-width: 480px) {
  .page { padding: 28px 16px 40px; }
  section.card { padding: 22px 16px; border-radius: 16px; }
  th, td { padding: 9px 10px; }
}
@media print {
  :root {
    --page: #ffffff; --surface: #ffffff; --surface-soft: #ffffff; --glow: transparent;
    --heading: #0a0227; --body: #3a3752; --divider: #cfcde0; --shadow: none;
  }
  body { background-image: none; font-size: 12px; }
  .page { max-width: none; padding: 0; }
  .scroll { overflow: visible; border: 0; }
  section.card { padding: 18px 16px; }
  tr { break-inside: avoid; }
  .grad { -webkit-text-fill-color: currentColor; background: none; color: var(--violet-accent); }
  .badge { border: 1px solid var(--divider); }
}

.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--divider); margin: 0 -16px; padding: 10px 16px 0; }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand svg { display: block; height: 28px; width: auto; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { .logo-light { display: none; } .logo-dark { display: inline-block; } }
.top h1 { font-size: clamp(20px, 3.4vw, 30px); margin: 6px 0 2px; }
.meta { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 8px; padding: 0; font-size: 12.5px; }
.meta span { font: 600 11px/1 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); margin-right: 4px; }
.status { display: inline-block; padding: 4px 12px; border-radius: 999px; font: 700 12px/1.3 var(--font-head); color: #ffffff; white-space: nowrap; }
.status.ok { background: var(--success); }
.status.bad { background: var(--error); }
.status.warn { background: var(--warning); color: var(--ink-900); }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: thin; }
nav.tabs a { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--divider); color: var(--heading); text-decoration: none; font: 600 13px/1.2 var(--font-head); background: var(--surface); }
nav.tabs a:hover, nav.tabs a:focus-visible { border-color: var(--violet-accent); outline: none; }
nav.tabs a[aria-current="true"] { background: var(--violet-button); border-color: var(--violet-button); color: #ffffff; }
section.tab { margin: 22px 0 8px; scroll-margin-top: 150px; }
.tab-title { font-size: clamp(22px, 3.6vw, 30px); margin: 0 0 4px; }
h3 { margin: 22px 0 10px; }
section.panel > h3:first-of-type { margin-top: 0; font-size: clamp(20px, 3vw, 24px); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 8px 0; }
.kpi { border: 1px solid var(--divider); border-radius: 14px; padding: 12px 14px; background: var(--surface-soft); min-width: 0; }
.kpi.unknown { border-style: dashed; }
.kpi p { margin: 0; }
.kpi-name { font: 600 12px/1.3 var(--font-head); color: var(--accent-text); }
.kpi-value { font: 800 22px/1.2 var(--font-head); letter-spacing: -0.02em; color: var(--heading); overflow-wrap: anywhere; }
.kpi.unknown .kpi-value { font: 500 13px/1.4 var(--font-body); color: var(--body); letter-spacing: 0; }
.kpi-delta { font-size: 12px; }
.kpi-spark { margin-top: 6px; min-height: 32px; font-size: 12px; }
svg.spark { width: 120px; height: 32px; display: block; }
svg.spark path { fill: none; stroke: var(--violet-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart.wide svg { max-width: 640px; }
svg .line { fill: none; stroke: var(--info); stroke-width: 2.5; stroke-linejoin: round; }
svg .line.spend-line { stroke: var(--violet-accent); }
svg .line.value-line { stroke: var(--success); }
svg .guide.cut { stroke: var(--error); opacity: 1; stroke-dasharray: 5 4; }
svg .line-dot { fill: var(--info); }
ul.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; padding: 0; font-size: 12.5px; color: var(--heading); }
ul.legend li { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: none; background: var(--violet-accent); }
.sw.line { background: var(--info); height: 4px; border-radius: 2px; }
.sw.spend-line { background: var(--violet-accent); height: 4px; border-radius: 2px; box-shadow: 0 0 0 1px var(--surface); }
.sw.value-line { background: var(--success); height: 4px; border-radius: 2px; }
svg .track { fill: var(--chip-bg); }
.gauge svg { max-width: 300px; }
.ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin: 10px 0; }
.ad-card { border: 1px solid var(--divider); border-radius: 16px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ad-img { background: var(--chip-bg); display: flex; justify-content: center; align-items: center; padding: 12px; min-height: 120px; }
.ad-img svg.pv, .ad-img svg.ph { display: block; width: 100%; max-width: 300px; height: auto; max-height: 280px; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 4px rgba(10, 2, 39, 0.18); }
svg.ph .ph-bg { fill: var(--surface-soft); }
svg.ph text { font-size: 13px; fill: var(--accent-text); }
svg.ph .ph-format { font: 800 22px/1 var(--font-head); fill: var(--heading); }
svg.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.kpi-note { margin: 2px 0 0; font-size: 11.5px; color: var(--accent-text); }
.kpi.partial { border-color: var(--warning); }
.ad-body { padding: 12px 14px 14px; }
.ad-body h4 { margin: 0; font: 700 15px/1.3 var(--font-head); color: var(--heading); overflow-wrap: anywhere; }
.ad-body p { margin: 4px 0; font-size: 13px; }
.adid { font-size: 11px; opacity: 0.8; }
.ad-spend b { color: var(--heading); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
.conf { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--divider); font: 600 11.5px/1.5 var(--font-head); color: var(--accent-text); }
.sentence { color: var(--heading); }
.next b, .check b, .driver { color: var(--accent-text); }
.check { border-left: 3px solid var(--error); padding-left: 8px; }
.empty { border: 1px dashed var(--divider); border-radius: 14px; background: var(--surface-soft); padding: 14px 18px; }
.empty p { margin: 6px 0; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.col { min-width: 0; }
.col h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; }
.count { font: 700 13px/1 var(--font-head); color: var(--heading); }
.col .ad-card { margin-bottom: 12px; }
.col .ad-img svg.pv, .col .ad-img svg.ph { max-height: 220px; }
.badge.cant, .badge.early { background: var(--ink-500); }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.multiple h4 { margin: 0 0 4px; font: 700 14px/1.3 var(--font-head); color: var(--heading); }
.multiple .chart { margin: 6px 0; }
details.rest, details.method { margin: 10px 0; }
details summary { cursor: pointer; font: 600 13px/1.4 var(--font-head); color: var(--accent-text); padding: 6px 0; }
details summary:focus-visible { outline: 2px solid var(--violet-accent); outline-offset: 2px; border-radius: 6px; }
footer .by { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
footer .by svg { display: block; height: 26px; width: auto; }
footer .by p { margin: 0; }
footer .logo-dark { display: none; }
@media (prefers-color-scheme: dark) { footer .logo-light { display: none; } footer .logo-dark { display: inline-block; } }
footer .method { text-align: left; }
footer .privacy { margin-top: 10px; }
.js section.tab[hidden] { display: none; }
@media (max-width: 640px) {
  .top { position: static; padding-top: 8px; }
  .brand svg { height: 22px; }
  .meta { font-size: 11.5px; gap: 2px 10px; }
  section.tab { scroll-margin-top: 170px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  figure.chart.wide { overflow-x: auto; }
  figure.chart.wide svg { min-width: 540px; }
  .multiple figure.chart.wide svg { min-width: 0; }
}
@media print {
  .top { position: static; border-bottom: 0; }
  nav.tabs { display: none; }
  .logo-light { display: inline-block !important; }
  .logo-dark { display: none !important; }
  section.tab, section.tab[hidden] { display: block !important; }
  section.panel, .ad-card, .kpi { break-inside: avoid; }
  .ad-img svg.pv, .ad-img svg.ph { max-height: 200px; }
}
</style>
</head>
<body>
<div class="page">
{{sprite}}
<header class="top">
<div class="top-row">
<div class="brand"><span class="logo-light" role="img" aria-label="Elephant Room">{{logo_light}}</span><span class="logo-dark" role="img" aria-label="Elephant Room">{{logo_dark}}</span></div>
{{badge}}
</div>
<h1>{{heading}}</h1>
<ul class="meta">{{meta}}</ul>
{{nav}}
</header>
<main>
{{body}}
</main>
{{footer}}
</div>
<script>
(function () {
  var root = document.documentElement;
  var tabs = Array.prototype.slice.call(document.querySelectorAll("section.tab"));
  var links = Array.prototype.slice.call(document.querySelectorAll("nav.tabs a"));
  if (!tabs.length) { return; }
  root.className += " js";
  var current = null;
  function show(id) {
    var el = id ? document.getElementById(id) : null;
    var tab = el ? el.closest("section.tab") : null;
    var tabId = tab ? tab.id : tabs[0].id;
    current = tabId;
    tabs.forEach(function (t) { t.hidden = t.id !== tabId; });
    links.forEach(function (link) {
      if (link.getAttribute("href") === "#" + tabId) { link.setAttribute("aria-current", "true"); } else { link.removeAttribute("aria-current"); }
    });
    if (el && el.id !== tabId) { el.scrollIntoView(); }
  }
  links.forEach(function (link) {
    link.addEventListener("click", function (event) {
      event.preventDefault();
      var id = link.getAttribute("href").slice(1);
      show(id);
      if (history.replaceState) { history.replaceState(null, "", "#" + id); }
      window.scrollTo(0, 0);
    });
  });
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  var closed = [];
  window.addEventListener("beforeprint", function () {
    tabs.forEach(function (tab) { tab.hidden = false; });
    closed = Array.prototype.slice.call(document.querySelectorAll("details:not([open])"));
    closed.forEach(function (d) { d.open = true; });
  });
  window.addEventListener("afterprint", function () {
    closed.forEach(function (d) { d.open = false; });
    show(current);
  });
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
