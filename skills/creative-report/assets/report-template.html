<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --violet-accent: #7c3aed;
  --violet-button: #6d28d9;
  --violet-50: #f5f3ff;
  --violet-100: #ede9fe;
  --violet-200: #ddd6fe;
  --violet-600: #7c3aed;
  --violet-900: #4c1d95;
  --ink-50: #f8f8fb;
  --ink-200: #e2e1ea;
  --ink-500: #6b6889;
  --ink-900: #0a0227;
  --success: #059669;
  --error: #dc2626;
  --warning: #e8ad00;
  --info: #343CED;

  --page: var(--ink-50);
  --glow: rgba(124, 58, 237, 0.16);
  --grad-from: var(--info);
  --surface: #ffffff;
  --surface-soft: var(--violet-50);
  --heading: var(--ink-900);
  --body: var(--ink-500);
  --divider: var(--ink-200);
  --accent-text: var(--violet-900);
  --chip-bg: var(--violet-100);
  --shadow: 0 1px 2px rgba(10, 2, 39, 0.05), 0 8px 24px rgba(76, 29, 149, 0.07);
  --font-head: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: var(--ink-900);
    --glow: rgba(124, 58, 237, 0.28);
    --grad-from: #8b92ff;
    --surface: #1a103d;
    --surface-soft: #1a103d;
    --heading: var(--ink-50);
    --body: var(--ink-200);
    --divider: rgba(221, 214, 254, 0.18);
    --accent-text: var(--violet-200);
    --chip-bg: rgba(124, 58, 237, 0.28);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--page);
  background-image: radial-gradient(60rem 28rem at 78% -6rem, var(--glow), transparent 70%);
  background-repeat: no-repeat;
  color: var(--body);
  font: 400 15px/1.6 var(--font-body);
}
.page { max-width: 1040px; margin: 0 auto; padding: 40px 16px 56px; }
.eyebrow {
  font: 600 12px/1 var(--font-head);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--violet-accent);
  margin: 0 0 12px;
}
h1, h2, h3 { font-family: var(--font-head); color: var(--heading); letter-spacing: -0.02em; margin: 0; }
h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.08; font-weight: 800; letter-spacing: -0.035em; }
h2 { font-size: clamp(22px, 3.6vw, 28px); line-height: 1.15; font-weight: 700; }
h3 { font-size: 16px; font-weight: 700; margin: 24px 0 10px; }
.grad {
  background: linear-gradient(90deg, var(--grad-from), var(--violet-accent));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: var(--violet-accent);
}
section.card {
  background: var(--surface);
  border: 1px solid var(--divider);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 28px 24px;
  margin: 20px 0;
}
section.card > .eyebrow { margin-bottom: 10px; }
p { margin: 10px 0; }
.lead { font-size: 16px; color: var(--heading); }
.muted { font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 6px; }
.stat { border: 1px solid var(--divider); border-radius: 14px; padding: 14px 16px; background: var(--surface-soft); }
.stat b { display: block; font: 800 28px/1.1 var(--font-head); letter-spacing: -0.03em; color: var(--heading); }
.stat span { font-size: 13px; }
.actions { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.actions li { border: 1px solid var(--divider); border-left: 4px solid var(--violet-accent); border-radius: 14px; padding: 14px 16px; background: var(--surface-soft); }
.actions strong { color: var(--heading); font-family: var(--font-head); }
.basis { background: var(--surface-soft); border: 1px dashed var(--divider); border-radius: 14px; padding: 16px 18px; }
.basis pre { margin: 0; white-space: pre-wrap; font: 400 13px/1.55 var(--font-body); color: var(--body); }
.scroll { overflow-x: auto; margin: 12px 0; border: 1px solid var(--divider); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: top; }
th { font: 600 12px/1.3 var(--font-head); letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-text); background: var(--surface-soft); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.why { min-width: 260px; }
td.adname { white-space: nowrap; }
@media (max-width: 640px) { td.adname { white-space: normal; } }
td small { display: block; color: var(--body); opacity: 0.8; }
.badge { display: block; width: fit-content; padding: 3px 10px; border-radius: 999px; font: 600 12px/1.4 var(--font-head); white-space: nowrap; color: var(--ink-900); background: var(--chip-bg); }
.badge.scale { background: var(--success); color: #ffffff; }
.badge.keep { background: var(--violet-accent); color: #ffffff; }
.badge.check { background: var(--info); color: #ffffff; }
.badge.iterate { background: var(--warning); color: var(--ink-900); }
.badge.kill { background: var(--error); color: #ffffff; }
.badge.cant { background: var(--ink-500); color: #ffffff; }
.badge.early { background: var(--ink-500); color: #ffffff; }
.band { margin-left: 6px; padding: 1px 7px; border-radius: 999px; font: 600 11px/1.5 var(--font-head); background: var(--chip-bg); color: var(--accent-text); }
.band.low { background: var(--error); color: #ffffff; }
.band.top { background: var(--success); color: #ffffff; }
.reasons { margin: 0; padding-left: 16px; }
.reasons li { margin: 2px 0; }
.chart { margin: 14px 0; }
.chart svg { display: block; width: 100%; height: auto; max-width: 600px; }
.chart figcaption { font-size: 13px; margin-top: 4px; }
figure.chart { margin: 14px 0; }
svg text { font-family: var(--font-body); fill: var(--body); font-size: 12px; }
svg .lbl { fill: var(--heading); }
svg .axis { stroke: var(--divider); stroke-width: 1; }
svg .guide { stroke: var(--ink-500); stroke-width: 1; stroke-dasharray: 4 4; opacity: 0.6; }
svg .bar { fill: var(--violet-accent); }
svg .bar.scale { fill: var(--success); }
svg .bar.keep { fill: var(--violet-accent); }
svg .bar.check { fill: var(--info); }
svg .bar.iterate { fill: var(--warning); }
svg .bar.kill { fill: var(--error); }
svg .bar.cant { fill: var(--ink-500); }
svg .bar.early { fill: var(--ink-500); }
svg .dot { fill: var(--violet-accent); fill-opacity: 0.75; stroke: var(--surface); stroke-width: 1.5; }
.cols { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cols.two { grid-template-columns: 1fr 1fr; } }
.grid-cell { text-align: center; min-width: 44px; }
.grid-cell.empty { background: var(--chip-bg); color: var(--accent-text); font-weight: 600; }
.grid-cell.full { color: var(--heading); font-weight: 600; }
.note-list { margin: 8px 0 0; padding-left: 18px; }
.note-list li { margin: 6px 0; }
code { font: 500 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip-bg); color: var(--accent-text); padding: 1px 6px; border-radius: 6px; }
footer { margin-top: 28px; font-size: 13px; text-align: center; }
footer b { color: var(--heading); font-family: var(--font-head); }
@media (max-width: 640px) {
  table.stack thead { display: none; }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: 100%; }
  table.stack tr { padding: 10px 4px; border-bottom: 1px solid var(--divider); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { border: 0; padding: 4px 12px; text-align: left; }
  table.stack td.num::before { content: attr(data-label) ": "; color: var(--accent-text); font-weight: 600; }
  td.why { min-width: 0; }
}
@media (max-width: 480px) {
  .page { padding: 28px 16px 40px; }
  section.card { padding: 22px 16px; border-radius: 16px; }
  th, td { padding: 9px 10px; }
}
@media print {
  :root {
    --page: #ffffff; --surface: #ffffff; --surface-soft: #ffffff; --glow: transparent;
    --heading: #0a0227; --body: #3a3752; --divider: #cfcde0; --shadow: none;
  }
  body { background-image: none; font-size: 12px; }
  .page { max-width: none; padding: 0; }
  .scroll { overflow: visible; border: 0; }
  section.card { padding: 18px 16px; }
  tr { break-inside: avoid; }
  .grad { -webkit-text-fill-color: currentColor; background: none; color: var(--violet-accent); }
  .badge { border: 1px solid var(--divider); }
}

.top { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--divider); margin: 0 -16px; padding: 10px 16px 0; }
.top-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; }
.brand svg { display: block; height: 28px; width: auto; }
.logo-dark { display: none; }
@media (prefers-color-scheme: dark) { .logo-light { display: none; } .logo-dark { display: inline-block; } }
.top h1 { font-size: clamp(20px, 3.4vw, 30px); margin: 6px 0 2px; }
.meta { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 8px; padding: 0; font-size: 12.5px; }
.meta span { font: 600 11px/1 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); margin-right: 4px; }
.status { display: inline-block; padding: 4px 12px; border-radius: 999px; font: 700 12px/1.3 var(--font-head); color: #ffffff; white-space: nowrap; }
.status.ok { background: var(--success); }
.status.bad { background: var(--error); }
.status.warn { background: var(--warning); color: var(--ink-900); }
nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: thin; }
nav.tabs a { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--divider); color: var(--heading); text-decoration: none; font: 600 13px/1.2 var(--font-head); background: var(--surface); }
nav.tabs a:hover, nav.tabs a:focus-visible { border-color: var(--violet-accent); outline: none; }
nav.tabs a[aria-current="true"] { background: var(--violet-button); border-color: var(--violet-button); color: #ffffff; }
section.tab { margin: 22px 0 8px; scroll-margin-top: 150px; }
.tab-title { font-size: clamp(22px, 3.6vw, 30px); margin: 0 0 4px; }
h3 { margin: 22px 0 10px; }
section.panel > h3:first-of-type { margin-top: 0; font-size: clamp(20px, 3vw, 24px); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 8px 0; }
.kpi { border: 1px solid var(--divider); border-radius: 14px; padding: 12px 14px; background: var(--surface-soft); min-width: 0; }
.kpi.unknown { border-style: dashed; }
.kpi p { margin: 0; }
.kpi-name { font: 600 12px/1.3 var(--font-head); color: var(--accent-text); }
.kpi-value { font: 800 22px/1.2 var(--font-head); letter-spacing: -0.02em; color: var(--heading); overflow-wrap: anywhere; }
.kpi.unknown .kpi-value { font: 500 13px/1.4 var(--font-body); color: var(--body); letter-spacing: 0; }
.kpi-delta { font-size: 12px; }
.kpi-spark { margin-top: 6px; min-height: 32px; font-size: 12px; }
svg.spark { width: 120px; height: 32px; display: block; }
svg.spark path { fill: none; stroke: var(--violet-accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart.wide svg { max-width: 640px; }
svg .line { fill: none; stroke: var(--info); stroke-width: 2.5; stroke-linejoin: round; }
svg .line.spend-line { stroke: var(--violet-accent); }
svg .line.value-line { stroke: var(--success); }
svg .guide.cut { stroke: var(--error); opacity: 1; stroke-dasharray: 5 4; }
svg .line-dot { fill: var(--info); }
ul.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 0; padding: 0; font-size: 12.5px; color: var(--heading); }
ul.legend li { display: flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; flex: none; background: var(--violet-accent); }
.sw.line { background: var(--info); height: 4px; border-radius: 2px; }
.sw.spend-line { background: var(--violet-accent); height: 4px; border-radius: 2px; box-shadow: 0 0 0 1px var(--surface); }
.sw.value-line { background: var(--success); height: 4px; border-radius: 2px; }
svg .track { fill: var(--chip-bg); }
.gauge svg { max-width: 300px; }
.ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin: 10px 0; }
.ad-card { border: 1px solid var(--divider); border-radius: 16px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ad-img { background: var(--chip-bg); display: flex; justify-content: center; align-items: center; padding: 12px; min-height: 120px; }
.ad-img svg.pv, .ad-img svg.ph { display: block; width: 100%; max-width: 300px; height: auto; max-height: 280px; border-radius: 12px; background: var(--surface); box-shadow: 0 1px 4px rgba(10, 2, 39, 0.18); }
svg.ph .ph-bg { fill: var(--surface-soft); }
svg.ph text { font-size: 13px; fill: var(--accent-text); }
svg.ph .ph-format { font: 800 22px/1 var(--font-head); fill: var(--heading); }
svg.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.kpi-note { margin: 2px 0 0; font-size: 11.5px; color: var(--accent-text); }
.kpi.partial { border-color: var(--warning); }
.ad-body { padding: 12px 14px 14px; }
.ad-body h4 { margin: 0; font: 700 15px/1.3 var(--font-head); color: var(--heading); overflow-wrap: anywhere; }
.ad-body p { margin: 4px 0; font-size: 13px; }
.adid { font-size: 11px; opacity: 0.8; }
.ad-spend b { color: var(--heading); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
.conf { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--divider); font: 600 11.5px/1.5 var(--font-head); color: var(--accent-text); }
.sentence { color: var(--heading); }
.next b, .check b, .driver { color: var(--accent-text); }
p.check { border-left: 3px solid var(--error); padding-left: 8px; }
.empty { border: 1px dashed var(--divider); border-radius: 14px; background: var(--surface-soft); padding: 14px 18px; }
.empty p { margin: 6px 0; }
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; align-items: start; }
.col { min-width: 0; }
.col h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; }
.count { font: 700 13px/1 var(--font-head); color: var(--heading); }
.col .ad-card { margin-bottom: 12px; }
.col .ad-img svg.pv, .col .ad-img svg.ph { max-height: 220px; }
.badge.cant, .badge.early { background: var(--ink-500); }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.multiple h4 { margin: 0 0 4px; font: 700 14px/1.3 var(--font-head); color: var(--heading); }
.multiple .chart { margin: 6px 0; }
details.rest, details.method { margin: 10px 0; }
details summary { cursor: pointer; font: 600 13px/1.4 var(--font-head); color: var(--accent-text); padding: 6px 0; }
details summary:focus-visible { outline: 2px solid var(--violet-accent); outline-offset: 2px; border-radius: 6px; }
footer .by { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
footer .by svg { display: block; height: 20px; width: auto; }
footer .by p { margin: 0; }
footer .logo-dark { display: none; }
@media (prefers-color-scheme: dark) { footer .logo-light { display: none; } footer .logo-dark { display: inline-block; } }
footer .method { text-align: left; }
footer .privacy { margin-top: 10px; }
.js section.tab[hidden] { display: none; }
@media (max-width: 640px) {
  .top { position: static; padding-top: 8px; }
  .brand svg { height: 22px; }
  .meta { font-size: 11.5px; gap: 2px 10px; }
  section.tab { scroll-margin-top: 170px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  figure.chart.wide { overflow-x: auto; }
  figure.chart.wide svg { min-width: 540px; }
  .multiple figure.chart.wide svg { min-width: 0; }
}
@media print {
  .top { position: static; border-bottom: 0; }
  nav.tabs { display: none; }
  .logo-light { display: inline-block !important; }
  .logo-dark { display: none !important; }
  section.tab, section.tab[hidden] { display: block !important; }
  section.panel, .ad-card, .kpi { break-inside: avoid; }
  .ad-img svg.pv, .ad-img svg.ph { max-height: 200px; }
}

/* interaction layer: lockup, filter bar, gallery, open view, dialog */
:root { --focus: var(--violet-accent); }
@media (prefers-color-scheme: dark) { :root { --focus: #c4b5fd; } }
.lockup { display: flex; align-items: center; gap: 10px; }
.brand-div { width: 1px; height: 22px; background: var(--divider); }
.brand-by { font: 600 12px/1 var(--font-head); color: var(--body); }
footer .lockup { justify-content: center; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, .ad-img:focus-visible, .pv-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
details summary:focus-visible { outline-color: var(--focus); }
.btn { font: 600 12.5px/1.2 var(--font-head); padding: 7px 14px; border-radius: 999px; border: 1px solid var(--violet-button); background: var(--violet-button); color: #ffffff; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent-text); border-color: var(--divider); }
.chip { font: 600 12.5px/1.2 var(--font-head); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--divider); background: var(--surface); color: var(--heading); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--violet-button); border-color: var(--violet-button); color: #ffffff; }
.chip.is-zero:not([aria-pressed="true"]) { opacity: 0.45; }
.chip .n { font-weight: 500; opacity: 0.8; margin-left: 2px; }
.is-out { display: none !important; }
.filterbar { display: none; }
.js .filterbar { display: block; position: relative; padding: 0 0 10px; }
.fb-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fb-search { display: flex; align-items: center; gap: 6px; }
.fb-label { font: 600 11px/1 var(--font-head); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
.fb-input { font: 400 14px/1.2 var(--font-body); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--divider); background: var(--surface); color: var(--heading); width: 200px; }
.fb-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.fb-summary { font-size: 12.5px; margin: 6px 0 0; color: var(--heading); }
.fb-empty { display: none; margin: 6px 0 0; font-size: 13px; color: var(--heading); }
.fb-empty.show { display: block; }
.fb-note { font-size: 12px; margin: 0 0 8px; }
details.facets summary { padding: 6px 12px; border: 1px solid var(--divider); border-radius: 999px; background: var(--surface); list-style: none; }
.facets-body { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; max-height: 50vh; overflow: auto; background: var(--surface); border: 1px solid var(--divider); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px; }
fieldset.facet { border: 0; padding: 0; margin: 6px 0 10px; min-width: 0; }
fieldset.facet legend { font: 700 12px/1.3 var(--font-head); color: var(--accent-text); padding: 0; margin-bottom: 4px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.gallery-controls { display: none; }
.js .gallery-controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.gallery-controls label { font: 600 12.5px/1.2 var(--font-head); color: var(--heading); display: flex; align-items: center; gap: 6px; }
.gallery-controls select { font: 400 13px/1.2 var(--font-body); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--divider); background: var(--surface); color: var(--heading); }
.group { margin: 18px 0; }
.group-head h4 { margin: 0; font: 700 16px/1.3 var(--font-head); color: var(--heading); }
.group-sub { font-size: 12.5px; margin: 2px 0 8px; }
.pv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin: 10px 0; }
.pv-tile { margin: 0; min-width: 0; }
.pv-btn { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.pv-tile svg, .pv-ph { display: block; width: 100%; height: auto; max-height: 190px; border-radius: 10px; background: var(--chip-bg); box-shadow: 0 1px 4px rgba(10, 2, 39, 0.18); }
.pv-ph { min-height: 110px; display: flex; align-items: center; justify-content: center; text-align: center; font: 600 11px/1.3 var(--font-head); color: var(--accent-text); padding: 6px; }
.pv-tile figcaption { font-size: 11.5px; margin-top: 4px; color: var(--heading); overflow-wrap: anywhere; }

    box.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(box);
    return ok;
  }
  function copyPrompt(btn) {
    var scope = btn.closest(".ad-card") || btn.closest(".open-body") || btn.closest(".prompt-scope");
    var pre = scope ? scope.querySelector("pre.prompt") : null;
    if (!pre) { return; }
    var was = btn.getAttribute("data-label") || btn.textContent;
    btn.setAttribute("data-label", was);
    function done() {
      btn.setAttribute("data-copied", "1");
      btn.textContent = "Copied";
      setTimeout(function () { btn.textContent = was; btn.removeAttribute("data-copied"); }, 1800);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pre.textContent).then(done, function () { if (fallbackCopy(pre.textContent)) { done(); } });
    } else if (fallbackCopy(pre.textContent)) { done(); }
  }

  function totalSpend() { return CR.total(DATA.ads, "spend") || 0; }
  function groupLine(s) {
    return s.ads + " ads · " + money(s.spend, 0) + " spend · " + (s.share === null ? "n/a" : Math.round(s.share) + "%") +
      " of spend · ROAS " + s.roas_text + " · CPA " + (s.cpa === null ? s.cpa_text : money(s.cpa, 2));
  }
  function rowsDetails(list) {
    var d = el("details", "rest");
    d.appendChild(el("summary", null, list.length + " more ads (compact list)"));
    var wrap = el("div", "scroll"), table = el("table", "stack"), head = el("tr"), body = el("tbody");
    [["Ad", ""], ["Spend", "num"], ["Verdict", ""]].forEach(function (c) { head.appendChild(el("th", c[1], c[0])); });
    var thead = el("thead");
    thead.appendChild(head);
    list.forEach(function (a) {
      var tr = el("tr"), name = el("td", "adname", a.label);
      tr.setAttribute("data-ad", a.id);
      name.appendChild(el("small", null, "Ad ID " + a.id));
      var spend = el("td", "num", money(present(a.spend) ? a.spend : null, 0));
      spend.setAttribute("data-label", "Spend");
      tr.appendChild(name);
      tr.appendChild(spend);
      tr.appendChild(el("td", null, a.verdict ? VERDICT_LABELS[a.verdict] || a.verdict : ""));
      body.appendChild(tr);
    });
    table.appendChild(thead);
    table.appendChild(body);
    wrap.appendChild(table);
    d.appendChild(wrap);
    return d;
  }
  function thumb(a) {
    var sym = document.getElementById("pv-" + a.id);
    if (!sym) { return el("div", "pv-ph", (a.format ? nameOf("format", a.format) : "format n/a") + " · preview unavailable"); }
    var vb = sym.getAttribute("viewBox"), nums = vb.split(" ");
    var svg = document.createElementNS(NS, "svg"), use = document.createElementNS(NS, "use");
    svg.setAttribute("viewBox", vb);
    svg.setAttribute("class", "pv");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", a.label + " (" + (a.format || "format not known") + ")");
    use.setAttribute("href", "#pv-" + a.id);
    use.setAttribute("width", nums[2]);
    use.setAttribute("height", nums[3]);
    svg.appendChild(use);
    return svg;
  }
  function previewGrid(list) {
    var grid = el("div", "pv-grid");
    list.forEach(function (a) {
      var fig = el("figure", "pv-tile"), btn = el("button", "pv-btn"), cap = el("figcaption", null, a.label);
      btn.type = "button";
      btn.setAttribute("data-open", a.id);
      btn.setAttribute("aria-label", "Open " + a.label);
      btn.appendChild(thumb(a));
      fig.appendChild(btn);
      if (a.verdict) { cap.appendChild(el("span", "badge " + (CSS_CLASS[a.verdict] || a.verdict), VERDICT_LABELS[a.verdict] || a.verdict)); }
      fig.appendChild(cap);
      grid.appendChild(fig);
    });
    return grid;
  }
  function renderGallery(list) {
    live.textContent = "";
    if (!list.length) {
      var none = el("p", "muted", "No ads match these filters. ");
      var clear = el("button", "btn", "Clear filters");
      clear.type = "button";
      clear.setAttribute("data-action", "clear");
      none.appendChild(clear);
      live.appendChild(none);
      return;
    }
    if (state.pv) { live.appendChild(previewGrid(CR.sortAds(list, state.sort))); return; }
    var groups = state.group === "none" ? [{ key: "all", label: "All ads", ads: list }] : CR.groupAds(list, state.group);
    groups.forEach(function (g) {
      var sec = el("section", "group"), head = el("header", "group-head"), grid = el("div", "ad-grid");
      var sorted = CR.sortAds(g.ads, state.sort);
      sec.setAttribute("data-group", g.key === null ? "unknown" : g.key);
      head.appendChild(el("h4", null, g.label));
      head.appendChild(el("p", "group-sub", groupLine(CR.summary(g.ads, list.length, totalSpend()))));
      sec.appendChild(head);
      sorted.slice(0, DATA.top_n).forEach(function (a) {
        var src = poolCard(a.id);
        if (src) { var c = src.cloneNode(true); enhanceCard(c); grid.appendChild(c); }
      });
      sec.appendChild(grid);
      if (sorted.length > DATA.top_n) { sec.appendChild(rowsDetails(sorted.slice(DATA.top_n))); }
      live.appendChild(sec);
    });
  }

  function summaryText(vis) {
    var s = CR.summary(vis, DATA.ads.length, totalSpend());
    var text = "Showing " + vis.length + " of " + DATA.ads.length + " ads";
    if (!vis.length) { return text + "."; }
    text += " · " + (s.share === null ? "n/a" : Math.round(s.share) + "%") + " of spend · spend " + money(s.spend, 0) +
      ", purchases " + (s.conversions === null ? "n/a (missing purchases)" : fmt(s.conversions, 0)) +
      ", ROAS " + s.roas_text + ", CPA " + (s.cpa === null ? s.cpa_text : money(s.cpa, 2)) + ".";
    var extra = [];
    if (state.fat) { extra.push("tiring out"); }
    if (state.weak) { extra.push("weak step: " + state.weak); }
    if (state.top) { extra.push("top " + state.top + " by spend"); }
    return text + (extra.length ? " Also filtering on: " + extra.join("; ") + "." : "") + " Charts stay account-wide.";
  }
  function pin() {
    var upper = document.querySelector(".top-upper"), top = document.querySelector(".top");
    if (upper && top) { top.style.top = DATA && window.innerWidth > 640 ? "-" + (upper.offsetHeight + 8) + "px" : ""; }
  }
  function sync() {
    if (!DATA) { writeHash(); return; }
    var ads = DATA.ads, vis = CR.visible(ads, state), set = Object.create(null);
    vis.forEach(function (a) { set[a.id] = true; });
    $all("[data-facet]").forEach(function (chip) {
      var k = chip.getAttribute("data-facet"), v = chip.getAttribute("data-value");
      var on = (state.facets[k] || []).indexOf(v) >= 0, count = CR.facetCount(ads, state, k, v);
      chip.setAttribute("aria-pressed", on ? "true" : "false");
      chip.querySelector(".n").textContent = count;
      chip.classList.toggle("is-zero", count === 0);
    });
    $all("[data-preset]").forEach(function (chip) {
      var ps = CR.presetState(DATA.presets, chip.getAttribute("data-preset"), defs);
      var count = CR.visible(ads, ps).length;
      chip.setAttribute("aria-pressed", CR.sameFilters(state, ps) ? "true" : "false");
      chip.querySelector(".n").textContent = count;
      chip.classList.toggle("is-zero", count === 0);
    });
    var input = document.querySelector(".fb-input");
    if (input && input.value !== state.q) { input.value = state.q; }
    $all("select[data-action]").forEach(function (sel) { sel.value = state[sel.getAttribute("data-action")]; });
    $all("[data-action='previews-only']").forEach(function (b) { b.setAttribute("aria-pressed", state.pv ? "true" : "false"); });
    var line = document.querySelector(".fb-summary");
    if (line) { line.textContent = summaryText(vis); }
    var empty = document.querySelector(".fb-empty");
    if (empty) { empty.classList.toggle("show", vis.length === 0); }
    $all("[data-ad]").forEach(function (n) {
      if (live && live.contains(n)) { return; }
      n.classList.toggle("is-out", !set[n.getAttribute("data-ad")]);
    });
    if (stat && live) {
      var plain = !CR.active(state) && state.group === defs.group && state.sort === defs.sort && !state.pv;
      stat.classList.toggle("is-out", !plain);
      if (plain) { live.textContent = ""; } else { renderGallery(vis); }
    }
    writeHash();
  }
  function toggleIn(list, value) {
    var i = list.indexOf(value);
    if (i >= 0) { list.splice(i, 1); } else { list.push(value); }
    return list;
  }

  document.addEventListener("click", function (event) {
    var t = event.target, b;
    if (!t || !t.closest) { return; }
    if ((b = t.closest("[data-action='copy-prompt']"))) { copyPrompt(b); return; }
    if ((b = t.closest("[data-action='close-dialog']"))) { if (dialog) { dialog.close(); } return; }
    if (!DATA) { return; }
    if (t.closest("[data-action='clear']")) { state = CR.emptyState(defs); sync(); return; }
    if (t.closest("[data-action='previews-only']")) { state.pv = !state.pv; sync(); return; }
    if ((b = t.closest("[data-preset]"))) {
      var id = b.getAttribute("data-preset"), ps = CR.presetState(DATA.presets, id, defs);
      var def = DATA.presets.filter(function (p) { return p.id === id; })[0];
      if (CR.sameFilters(state, ps)) { ps = CR.emptyState(defs); def = null; }
      state.facets = ps.facets; state.fat = ps.fat; state.top = ps.top; state.weak = null;
      if (def && def.sort) { state.sort = def.sort; }
      sync();
      return;
    }
    if ((b = t.closest("[data-facet]"))) {
      var k = b.getAttribute("data-facet");
      state.facets[k] = toggleIn(state.facets[k] || [], b.getAttribute("data-value"));
      sync();
      return;
    }
    if ((b = t.closest("a[data-weak]"))) {
      event.preventDefault();
      state = CR.emptyState(defs);
      state.weak = b.getAttribute("data-weak");
      show("panel-all-ads");
      sync();
      return;
    }
    if ((b = t.closest("[data-open]"))) {
      var card = poolCard(b.getAttribute("data-open"));
      if (card) { openCard(card, b); }
      return;
    }
    var img = t.closest(".ad-img");
    if (img && img.closest(".ad-card")) { openCard(img.closest(".ad-card"), img); }
  });
  document.addEventListener("keydown", function (event) {
    var t = event.target;
    if ((event.key === "Enter" || event.key === " ") && t && t.classList && t.classList.contains("ad-img") && t.getAttribute("role") === "button") {
      event.preventDefault();
      openCard(t.closest(".ad-card"), t);
    } else if ((event.key === "Enter" || event.key === " ") && t && t.getAttribute && t.getAttribute("data-open") && t.getAttribute("role") === "button") {
      event.preventDefault();
      t.click();
    }
  });
  document.addEventListener("input", function (event) {
    if (DATA && event.target.classList && event.target.classList.contains("fb-input")) { state.q = event.target.value; sync(); }
  });
  document.addEventListener("change", function (event) {
    var sel = event.target;
    if (DATA && sel.matches && sel.matches("select[data-action]")) { state[sel.getAttribute("data-action")] = sel.value; sync(); }
  });
  if (dialog) {
    dialog.addEventListener("close", function () { if (opener && opener.focus) { opener.focus(); } opener = null; });
    dialog.addEventListener("click", function (event) { if (event.target === dialog) { dialog.close(); } });
  }
  links.forEach(function (link) {
    link.addEventListener("click", function (event) {
      event.preventDefault();
      show(link.getAttribute("href").slice(1));
      writeHash();
      window.scrollTo(0, 0);
    });
  });
  window.addEventListener("hashchange", function () { state = CR.fromHash(location.hash, defs); show(state.tab); sync(); });
  var closed = [];
  window.addEventListener("beforeprint", function () {
    tabs.forEach(function (tab) { tab.hidden = false; });
    closed = $all("details:not([open])");
    closed.forEach(function (d) { d.open = true; });
  });
  window.addEventListener("afterprint", function () {
    closed.forEach(function (d) { d.open = false; });
    show(current);
  });
  $all("article.ad-card").forEach(enhanceCard);
  $all(".pv-tile > .pv-btn[data-open]").forEach(function (tile) {
    var cap = tile.parentNode.querySelector("figcaption");
    tile.setAttribute("role", "button");
    tile.setAttribute("tabindex", "0");
    tile.setAttribute("aria-label", "Open " + (cap ? cap.textContent : "ad"));
  });
  window.addEventListener("resize", pin);
  window.addEventListener("load", pin);
  pin();
  state = CR.fromHash(location.hash, defs);
  show(state.tab);
  sync();
})();
</script>
</body>
</html>
